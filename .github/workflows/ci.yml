name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check src scripts demo tests

      - name: Isort
        run: isort --check-only --diff src scripts demo tests

      - name: Mypy
        run: mypy src --show-error-codes

      - name: Pyright
        run: pyright

      - name: Compile all
        run: python -m compileall src scripts demo tests

      - name: CLI smoke (mock/no-trace)
        run: python -m math_agent.cli solve --question "计算 2+3" --enable-tools --mode fast --no-trace

      - name: Pytest
        run: python -m pytest -q

      - name: Cleanup caches and runtime artifacts
        run: |
          rm -rf .pytest_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          if [ -d outputs ]; then
            find outputs -mindepth 1 ! -name '.gitkeep' -exec rm -rf {} +
          fi
          if [ -d trace ]; then
            find trace -mindepth 1 ! -name '.gitkeep' -exec rm -rf {} +
          fi

      - name: Project safety check
        run: python scripts/check_project_safety.py
